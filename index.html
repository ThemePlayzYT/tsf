    <style>
:root {
  color-scheme: dark;
  --background: #090b10;
  --surface: #11151d;
  --surface-raised: #171c25;
  --gold: #f2c75c;
  --gold-soft: #ffe7a2;
  --text: #f7f7f4;
  --muted: #a6acb9;
  --border: rgba(242, 199, 92, .17);
  --shadow: 0 24px 70px rgba(0, 0, 0, .34);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(ellipse at 50% -25%, rgba(196, 146, 41, .16), transparent 42%),
    var(--background);
  color: var(--text);
  font: 16px/1.6 Inter, "Segoe UI", Arial, sans-serif;
}
body::before {
  position: fixed;
  z-index: -1;
  inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
  background-size: 48px 48px;
  content: "";
  mask-image: linear-gradient(to bottom, black, transparent 74%);
  pointer-events: none;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { color: inherit; font: inherit; }
.container { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }

.topbar {
  position: sticky;
  z-index: 10;
  top: 0;
  border-bottom: 1px solid rgba(255,255,255,.07);
  background: rgba(9,11,16,.85);
  backdrop-filter: blur(18px);
}
.navbar { display: flex; min-height: 78px; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: inline-flex; align-items: center; gap: 11px; white-space: nowrap; font-size: .95rem; font-weight: 850; letter-spacing: .13em; }
.brand img { width: 39px; height: 39px; object-fit: contain; }
.nav-links, .nav-actions { display: flex; align-items: center; gap: 8px; }
.nav-links { justify-content: center; }
.nav-item {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 10px 13px;
  border: 1px solid transparent;
  border-radius: 11px;
  color: #c4c7ce;
  font-size: .8rem;
  font-weight: 750;
  letter-spacing: .07em;
  text-transform: uppercase;
  transition: color .2s, background .2s, border-color .2s;
}
.nav-item img { width: 17px; height: 17px; object-fit: contain; filter: brightness(0) invert(1); opacity: .82; }
.nav-item:hover img, .nav-item.active img { filter: brightness(0) saturate(100%) invert(82%) sepia(40%) saturate(700%) hue-rotate(357deg) brightness(105%); opacity: 1; }
.nav-item:hover, .nav-item.active { color: var(--gold-soft); border-color: var(--border); background: rgba(242,199,92,.07); }
.nav-actions { gap: 10px; }
.account-chip { display: inline-flex; min-width: 0; align-items: center; gap: 8px; color: var(--gold-soft); font-size: .8rem; font-weight: 800; }
.account-chip img { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; image-rendering: pixelated; }
.button {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  padding: 10px 17px;
  border: 1px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  font-size: .79rem;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: transform .2s, box-shadow .2s, background .2s, border-color .2s;
}
.button:hover { transform: translateY(-2px); }
.button-gold { color: #211a09; background: linear-gradient(135deg, #ffe18a, #dba633); box-shadow: 0 8px 24px rgba(218,166,51,.18); }
.button-gold:hover { box-shadow: 0 10px 30px rgba(218,166,51,.3); }
.button-outline { border-color: var(--border); background: rgba(255,255,255,.025); }
.button-outline:hover { border-color: rgba(242,199,92,.42); background: rgba(242,199,92,.08); }
.button-small { min-height: 38px; padding: 8px 12px; }

.home-hero {
  position: relative;
  display: grid;
  min-height: 470px;
  align-content: center;
  overflow: hidden;
  padding: 42px 20px;
  text-align: center;
}
.hero-glow {
  position: absolute;
  top: 5%;
  left: 50%;
  width: min(720px, 100vw);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(209,158,52,.17), rgba(131,88,22,.06) 42%, transparent 69%);
  transform: translateX(-50%);
  pointer-events: none;
}
.home-hero::after {
  position: absolute;
  z-index: 0;

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function normalizedRoute() {
  return window.location.pathname.replace(/\/+$/, "") || "/";
}

// Old links like /#/rules still work: convert them to clean paths once.
function convertLegacyHash() {
  if (window.location.hash.startsWith("#/")) {
    const clean = window.location.hash.slice(1) + window.location.search;
    history.replaceState(null, "", clean);
  }
}

async function copyText(text, successMessage) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const input = document.createElement("textarea");
    input.value = text;
    input.style.position = "fixed";
    input.style.opacity = "0";
    document.body.append(input);
    input.select();
    const copied = document.execCommand("copy");
    input.remove();
    if (!copied) {
      showToast("Could not copy");
      return;
    }
  }
  showToast(successMessage);
}

async function loadMinecraftStatus() {
  const players = document.querySelector("[data-minecraft-players]");
  if (!players) return;
  try {
    const response = await fetch(`https://api.mcstatus.io/v2/status/java/${SERVER_ADDRESS}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`Minecraft status request failed (${response.status})`);
    const result = await response.json();
    if (!result.online) {
      players.textContent = "0 PLAYERS ONLINE";
      return;
    }
    const count = Number(result.players?.online);
    if (!Number.isFinite(count)) throw new Error("Minecraft status response did not include a player count");
    players.textContent = `${count.toLocaleString()} PLAYERS ONLINE`;
  } catch (error) {
    console.warn("Minecraft player count is unavailable; showing zero.", error);
    players.textContent = "0 PLAYERS ONLINE";
  }
}

async function loadDiscordCounts() {
  const online = document.querySelector("[data-discord-online]");
  if (!online) return;
  try {
    const response = await fetch("https://discord.com/api/v10/invites/Ka39NRCRGm?with_counts=true", { cache: "no-store" });
    if (!response.ok) throw new Error(`Discord invite request failed (${response.status})`);
    const data = await response.json();
    const presence = data.approximate_presence_count;
    if (!Number.isFinite(presence) || presence < 0) {
      throw new Error("Discord response did not include an online presence count");
    }
    online.textContent = `${presence.toLocaleString()} USERS ONLINE`;
  } catch (error) {
    console.warn("Discord online presence is unavailable.", error);
    online.textContent = "PRESENCE UNAVAILABLE";
  }
}

function updateLoginProfile(username) {
  const form = document.querySelector("[data-login-form]");
  const profile = document.querySelector("[data-login-profile]");
  const playerName = document.querySelector("[data-profile-name]");
  const playerHead = document.querySelector("[data-profile-head]");
  const message = document.querySelector("[data-profile-message]");
  if (!form || !profile || !playerName || !playerHead) return;
  if (!username) {
    form.hidden = false;
    profile.hidden = true;
    return;
  }
  form.hidden = true;
  profile.hidden = false;
  playerName.textContent = username;
  playerHead.src = skinAsset(username);
  playerHead.alt = `${username} Minecraft head`;
  playerHead.onerror = () => {
    playerHead.onerror = null;
    playerHead.src = IMG.steve;
  };
  if (message) message.textContent = "Username profile saved on this device.";
}

function logoutPlayer() {
  try {
    localStorage.removeItem(USER_STORAGE_KEY);
  } catch {
    showToast("Could not clear this browser's saved profile");
    return;
  }
  makeHeader();
  updateLoginProfile("");
  showToast("Logged out");
}

function initializeLogin() {
  const form = document.querySelector("[data-login-form]");
  if (!form) return;
  updateLoginProfile(getPlayer()?.username || "");
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const input = form.querySelector("[name=username]");
    const message = document.querySelector("[data-login-message]");
    const username = input.value.trim();
    if (!/^[A-Za-z0-9_]{3,16}$/.test(username)) {
      message.textContent = "Enter a valid Minecraft username (3–16 letters, numbers or underscores).";
      input.focus();
      return;
    }
    try {
      localStorage.setItem(USER_STORAGE_KEY, username);
    } catch {
      message.textContent = "This browser could not save your profile. Check its storage settings and try again.";
      return;
    }
    makeHeader();
    updateLoginProfile(username);
  });
  document.querySelector("[data-profile-logout]")?.addEventListener("click", logoutPlayer);
}

function hydrateImages(root) {
  root.querySelectorAll("img[data-img]").forEach((image) => {
    image.src = IMG[image.dataset.img];
    image.removeAttribute("data-img");
  });
}

function renderRoute() {
  const app = document.getElementById("app");
  const route = normalizedRoute();
  let key = ROUTES[route];
  let rank = null;
  const match = route.match(/^\/store\/lifesteal\/ranks\/([a-z0-9-]+)$/);
  if (match) {
    rank = rankProducts.find((item) => item.slug === match[1]);
    if (rank) key = "rank";
  }
  if (!key) key = "notfound";

  const template = document.getElementById(`page-${key}`);
  app.className = template.dataset.mainClass || "";
  app.innerHTML = template.innerHTML;
  hydrateImages(app);

  let title = template.dataset.title;
  if (rank) {
    title = `${rank.name} Rank | ThemeSMP`;
    app.querySelector("[data-rank-title]").textContent = rank.name;
    app.querySelector("[data-rank-sub]").textContent = `${rank.name} rank details and server perks.`;
    app.querySelector("[data-rank-detail]").dataset.rankDetail = rank.slug;
  }
  document.title = title;
  const description = document.querySelector('meta[name="description"]');
  if (description && template.dataset.desc) description.setAttribute("content", template.dataset.desc);

  makeHeader();
  renderRanks();
  renderCoins();
  renderStaff();
  renderStoreInformation();
  initializeLogin();
  loadMinecraftStatus();
  loadDiscordCounts();
  window.scrollTo({ top: 0, behavior: "instant" });
}

addPurchaseDialog();

document.addEventListener("click", (event) => {
  if (!(event.target instanceof Element)) return;
  const link = event.target.closest("a[href]");
  if (link && link.origin === window.location.origin && !link.hasAttribute("target")
      && !event.metaKey && !event.ctrlKey && !event.shiftKey && event.button === 0) {
    event.preventDefault();
    if (link.pathname + link.search + link.hash !== window.location.pathname + window.location.search + window.location.hash) {
      history.pushState(null, "", link.pathname + link.search + link.hash);
      renderRoute();
    }
    return;
  }
  if (event.target.closest("[data-copy-ip]")) copyServerAddress();
  if (event.target.closest("[data-copy-port]")) copyServerPort();
});

window.addEventListener("popstate", renderRoute);
convertLegacyHash();
renderRoute();

window.setInterval(() => {
  if (!document.hidden) loadMinecraftStatus();
}, 60_000);
window.setInterval(() => {
  if (!document.hidden) loadDiscordCounts();
}, 5 * 60_000);

    </script>
